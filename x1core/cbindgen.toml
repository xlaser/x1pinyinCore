# cbindgen 配置 — 生成 C 头文件（include/x1core_ffi.h）
#
# 只导出 #[no_mangle] pub extern "C" 函数 + X1Engine 不透明类型。
# Rust 内部常量（VALID_SYLLABLES / COMMON_CHAR_FREQ / BUILTIN_DICT 等）
# 不是 pub extern "C"，cbindgen 会跳过——这些跳过是预期行为，不是错误。
#
# 重新生成（在 x1core/ 目录下）：
#   cbindgen --config cbindgen.toml --output include/x1core_ffi.h
#   （-q 可抑制 WARN 输出，全是"跳过不该导出的内部常量"的正常提示）

language = "C"
header = """
/* x1core FFI header — auto-generated by cbindgen, do not edit.
 *
 * 内存契约：x1_engine_process 等返回的字符串用 x1_string_free 释放；
 * 引擎指针用 x1_engine_free 释放；x1_engine_version 返回静态串，不得释放。
 * 线程契约：Engine 非线程安全，同一实例的全部调用必须在同一线程。
 * 重新生成：cd x1core && cbindgen --config cbindgen.toml --output include/x1core_ffi.h
 */
"""
include_version = true

[parse]
parse_deps = false

[export]
include = ["X1Engine"]
# 内部调参常量/版本号不进公共 C API（引擎行为不受宿主直接改写这些值影响）
exclude = [
    "MAX_FREQ", "ALPHA_PIN", "ALPHA_BIGRAM", "ALPHA_INPUT", "ALPHA_PIN_CTX",
    "MIN_TOTAL", "MIN_DEVIATION", "HIGH_TOTAL", "HIGH_DEVIATION",
    "CLAMP_LO", "CLAMP_HI", "MIN_RELATIVE_CHANGE", "LIFT_MAX_OLD",
    "FREQ_MAX", "FREQ_MIN", "MAX_INPUT_BYTES",
    "USER_SCHEMA_VERSION", "DICT_SCHEMA_VERSION",
]
