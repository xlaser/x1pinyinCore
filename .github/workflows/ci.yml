name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check（全目标）
        run: cargo check --workspace --all-targets
      - name: Clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 格式检查（rustfmt）
        run: cargo fmt --all --check
      - name: 纯逻辑测试（无需种子 DB）
        run: >
          cargo test -p x1core --lib --
          pinyin:: quickcmds symbols:: fuzzy::tests:: stats::tests
      - name: 最小种子自举（建库 + 引擎加载自验证）
        run: cargo run -q -p x1core --bin seed_init -- target/mini_seed.db

  # 全量测试：词库三件套（种子 DB / bigram 缓存 / 语法模型）随仓库分发，
  # checkout 即得，无需外部下载
  full-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 全量测试
        run: cargo test -p x1core --lib

  ffi-example:
    name: C 头文件 + minimal.c 编译链接
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 staticlib
        run: cargo build -p x1core --release
      # 直接链接 staticlib 归档：-lx1core 会优先命中 cdylib 的
      # libx1core.so，可执行文件运行时报缺共享库
      - name: 编译并链接 minimal.c
        run: >
          cc -I x1core/include examples/minimal.c -o target/minimal
          target/release/libx1core.a -lpthread -ldl -lm
      - name: 运行示例
        run: target/minimal
